Name: core
Host: 0.0.0.0
Port: 18000

Log:
  ServiceName: coreApiLogger
  Mode: console
  Path: /runtime/logs
  Encoding: plain
  Level: debug
  Compress: false
  KeepDays: 7
  StackCoolDownMillis: 100

CoreRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: core.rpc

I18n:
  DefaultLanguage: zh-CN