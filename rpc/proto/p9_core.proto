syntax = "proto3";

package core;

option go_package = "github.com/ns9ryan/p9_core/rpc/pb/core";

import "types/base.proto";

message PingRequest {
}

message PingResponse {
  string message = 1;
}

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

service BaseService {
  rpc InitDatabase(base.InitDatabaseRequest) returns (base.InitDatabaseResponse);
}