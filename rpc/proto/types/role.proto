syntax = "proto3";

package role;

option go_package = "github.com/ns9ryan/p9_core/rpc/pb/core/role";

// 角色信息
message RoleInfo {
  // 角色 ID
  uint64 id = 1;
  // 展示名称
  string trans = 2;
  // 状态
  uint32 status = 3;
  // 角色名称
  string name = 4;
  // 角色编码
  string code = 5;
  // 备注
  string remark = 6;
  // 排序
  uint32 sort = 7;
}

// 创建角色请求
message CreateRoleRequest {
  // 状态
  optional uint32 status = 1;
  // 角色名称
  string name = 2;
  // 角色编码
  string code = 3;
  // 备注
  optional string remark = 4;
  // 排序
  optional uint32 sort = 5;
}

// 创建角色响应
message CreateRoleResponse {
  // 角色 ID
  uint64 id = 1;
}

// 更新角色请求
message UpdateRoleRequest {
  // 角色 ID
  uint64 id = 1;
  // 状态
  optional uint32 status = 2;
  // 角色名称
  optional string name = 3;
  // 角色编码
  optional string code = 4;
  // 备注
  optional string remark = 5;
  // 排序
  optional uint32 sort = 6;
}

// 更新角色响应
message UpdateRoleResponse {}

// 获取角色请求
message GetRoleRequest {
  // 角色 ID
  uint64 id = 1;
}

// 获取角色响应
message GetRoleResponse {
  // 角色信息
  RoleInfo role = 1;
}

// 获取角色列表请求
message ListRolesRequest {
  // 页码, 从 1 开始
  uint64 page = 1;
  // 每页数量
  uint64 page_size = 2;

  // 状态
  optional uint32 status = 3;
  // 角色名称
  optional string name = 4;
  // 角色编码
  optional string code = 5;
}

// 获取角色列表响应
message ListRolesResponse {
  // 数据总数
  uint64 total = 1;
  // 角色列表
  repeated RoleInfo data = 2;
}

// 批量删除角色请求
message BatchDeleteRolesRequest {
  // 角色 ID 列表
  repeated uint64 ids = 1;
}

// 批量删除角色响应
message BatchDeleteRolesResponse {}